[package]
name = "git-remote-igit"
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
description = "Git remote helper for the native igit:// infinigit transport"
repository = "https://github.com/infinigit-labs/git-remote-igit"
homepage = "https://infinigit.com"
readme = "README.md"
keywords = ["git", "remote-helper", "icp", "internet-computer"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[dependencies]
candid_parser = "0.4.1"
ic-agent = { version = "0.49", features = ["pem"] }
dirs-next = "2"
serde_json = "1"
sha2 = "0.10"
rpassword = "7"
tempfile = "3.13"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bin]]
name = "git-remote-igit"
path = "src/main.rs"

[[bin]]
name = "infinigit-pack"
path = "src/bin/infinigit-pack.rs"
